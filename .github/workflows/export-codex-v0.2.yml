name: Export Codex v0.2 bundle

on:
  push:
    branches:
      - codex/v0.2-codex-adapter
    paths:
      - .github/workflows/export-codex-v0.2.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build Codex upload ZIP
        run: |
          zip -qr UIBlame-v0.2-codex-adapter.zip .             -x '.git/*'             -x 'node_modules/*'             -x '.github/workflows/export-codex-v0.2.yml'

      - uses: actions/upload-artifact@v4
        with:
          name: UIBlame-v0.2-codex-adapter
          path: UIBlame-v0.2-codex-adapter.zip
          if-no-files-found: error
          retention-days: 7
