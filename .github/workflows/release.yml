name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify tag matches package version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const p=require('./packages/uiblame/package.json'); const v=process.argv[1]; if (p.version !== v) throw new Error('Tag/package version mismatch: '+v+' vs '+p.version)" "$VERSION"

      - name: Install and verify
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run pack:check

      - name: Publish npm package if needed
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "uiblame@${VERSION}" version >/dev/null 2>&1; then
            echo "uiblame@${VERSION} already exists; skipping npm publish."
          else
            npm publish -w uiblame --access public --provenance
          fi

      - name: Create GitHub release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists."
          else
            gh release create "$GITHUB_REF_NAME"               --repo "$GITHUB_REPOSITORY"               --verify-tag               --title "UIBlame $GITHUB_REF_NAME"               --generate-notes
          fi
