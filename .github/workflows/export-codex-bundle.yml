name: Export Codex Cloud bundle

on:
  pull_request:
    branches: [main]

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create source bundle
        run: |
          zip -qr UIBlame-v0.1-current.zip .             -x '.git/*'             -x 'node_modules/*'             -x 'apps/demo/dist/*'             -x 'packages/uiblame/dist/*'
      - uses: actions/upload-artifact@v4
        with:
          name: UIBlame-v0.1-current
          path: UIBlame-v0.1-current.zip
          if-no-files-found: error
