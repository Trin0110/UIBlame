name: Tag v0.1.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tag-v0.1.1.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create annotated v0.1.1 tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/v0.1.1" >/dev/null; then
            echo "Tag v0.1.1 already exists."
          else
            git tag -a v0.1.1 "$GITHUB_SHA" -m "UIBlame v0.1.1"
            git push origin refs/tags/v0.1.1
          fi
