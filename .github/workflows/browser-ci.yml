name: Browser CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build UIBlame package
        run: npm run build -w uiblame

      - name: Start demo
        run: |
          npm run dev -w @uiblame/demo -- --host 127.0.0.1 > /tmp/uiblame-vite.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/uiblame-vite.log
          exit 1

      - name: Run Chromium interaction regression
        env:
          UIBLAME_DEMO_URL: http://127.0.0.1:5173
        run: npm run test:browser
