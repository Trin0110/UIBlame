name: Generate stabilized v0.1 lockfile

on:
  push:
    branches: [codex/v0.1-stabilized]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Generate exact verified lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test "$(git hash-object package-lock.json)" = "060f3bef36963d0c6f3b07d33d1d121ccd2d8cb2"
      - name: Commit lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock stabilized v0.1 dependencies"
          git push origin HEAD:codex/v0.1-stabilized
