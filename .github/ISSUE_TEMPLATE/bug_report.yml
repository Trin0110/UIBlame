name: Bug report
description: Something in UIBlame is not working as expected.
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: UIBlame version
      placeholder: 0.1.0
  - type: input
    id: vite
    attributes:
      label: Vite version
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Link a repository or paste the smallest reproduction you can share.
